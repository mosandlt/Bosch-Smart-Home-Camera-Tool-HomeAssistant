name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # `ignore: brands` removed 2026-06-02: hacs/action now recognises the
          # local custom_components/<domain>/brand/ folder (HA 2026.3 brands
          # proxy), so HACS validation passes without it. Verified green on
          # branch test-brands-no-ignore (run 26843082038).
