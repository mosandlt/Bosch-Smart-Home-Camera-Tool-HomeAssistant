[tool.coverage.run]
# tls_proxy runs its accept loop + pipe pumps inside daemon threads.
# Default coverage tracer only sees the main thread, so the keepalive
# setsockopt fall-through + socket-close exception arms get reported
# as uncovered even when tests exercise them. `concurrency = ["thread"]`
# wraps `threading.Thread.run` so coverage follows the thread bodies.
concurrency = ["thread"]

[tool.mypy]
python_version = "3.12"
files = ["custom_components/bosch_shc_camera"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "homeassistant.*",
    "voluptuous.*",
    "aiohttp.*",
    "yarl.*",
    "firebase_messaging.*",
    "smbprotocol.*",
    "google.*",
    "cryptography.*",
    "OpenSSL.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
