title: "[Show & Tell] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Share your setup, dashboard, automation, or creative use of the integration!
        (Zeig deinen Setup, dein Dashboard, deine Automatisierung — wir freuen uns drauf!)
  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      placeholder: "v13.2.0"
    validations:
      required: true
  - type: dropdown
    id: cam_model
    attributes:
      label: Camera Model(s) in your setup
      options:
        - Eyes Outdoor (Gen1)
        - 360° Indoor (Gen1)
        - Eyes Outdoor II (Gen2)
        - Eyes Indoor II (Gen2)
        - Multiple / mixed (Mehrere / gemischt)
      multiple: true
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: What are you sharing?
      options:
        - Dashboard / Lovelace card
        - Automation
        - Script / Blueprint
        - Node-RED flow
        - Full smart home setup
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Describe what you built and why it is useful."
    validations:
      required: true
  - type: textarea
    id: code_config
    attributes:
      label: Config / Code Snippet (optional)
      description: "Paste YAML, JSON, or code if you want to share the details."
      render: yaml
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Links (optional)
      description: "Drag & drop images or paste links."
    validations:
      required: false
