[tool.coverage.run]
# tls_proxy runs its accept loop + pipe pumps inside daemon threads.
# Default coverage tracer only sees the main thread, so the keepalive
# setsockopt fall-through + socket-close exception arms get reported
# as uncovered even when tests exercise them. `concurrency = ["thread"]`
# wraps `threading.Thread.run` so coverage follows the thread bodies.
concurrency = ["thread"]

[tool.mypy]
python_version = "3.12"
platform = "linux"  # HA runs on Linux; analyze platform-specific stdlib (socket.TCP_KEEPIDLE etc.) as Linux regardless of host OS (macOS dev vs Linux CI)
files = ["custom_components/bosch_shc_camera"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "homeassistant.*",
    "voluptuous.*",
    "aiohttp.*",
    "firebase_messaging.*",
    "smbprotocol.*",
    "smbclient",
    "smbclient.*",
    "cryptography.*",
    "PIL.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["build", "captures", "credentials", "snapshots", "events", "research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C90", "RUF"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "S311",    # stdlib PRNG is used for non-crypto jitter/labels only
    "C901",    # complexity is reported via mccabe below, not hard-failed inline
    "RUF001",  # ambiguous unicode in strings — intentional typography (×, –, …) + German
    "RUF002",  # ambiguous unicode in docstrings — same
    "RUF003",  # ambiguous unicode in comments — same
    # S104/S108/S110/S112/S310 are NOT globally ignored — each known-safe site
    # carries a per-line `# noqa: S### # reason` so NEW occurrences still fail CI.
    "S101",    # asserts are deliberate mypy type-narrowing invariants (see "narrowed by" comments) — required for mypy --strict
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "F401", "F811", "F841", "E402", "B011", "B017"]
"scripts/**" = ["S", "T201"]
# E402 stays globally enforced; these four HA-layout modules intentionally place
# module-level imports after code: camera.py calls urllib3.disable_warnings()
# before its homeassistant imports (private-CA TLS); __init__.py / config_flow.py
# import sibling modules lazily after a constant + helper to avoid circular
# imports; sensor.py defers `import re as _re_inst` to the bottom of the module.
"custom_components/bosch_shc_camera/__init__.py" = ["E402"]
"custom_components/bosch_shc_camera/camera.py" = ["E402"]
"custom_components/bosch_shc_camera/config_flow.py" = ["E402"]
"custom_components/bosch_shc_camera/sensor.py" = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 40

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.pylint.MASTER]
persistent = false
jobs = 2

[tool.pylint.BASIC]
class-const-naming-style = "any"

[tool.pylint.REPORTS]
score = false

[tool.pylint."MESSAGES CONTROL"]
enable = [
  "use-symbolic-message-instead",
]
disable = [
  # ruff already enforces these — disable to avoid duplicate CI noise
  "format",
  "wrong-import-order",
  "line-too-long",
  "unused-import",        # ruff F401
  "unused-variable",      # ruff F841
  "cell-var-from-loop",   # ruff B023
  # mypy already enforces these
  "import-error",
  "no-member",
  "unexpected-keyword-arg",
  # genuine HA entity/coordinator false positives
  # pylint_home_assistant (HA core's private plugin) would handle these;
  # without it they fire on every standard HA pattern.
  "abstract-method",                # HA base classes intentionally leave methods abstract
  "access-member-before-definition",# entity attrs set in async_added_to_hass not __init__
  "attribute-defined-outside-init", # same
  "broad-exception-caught",         # async coordinators catch broadly to survive network errors
  "cyclic-import",                  # HA component loading creates inherent cycles
  "duplicate-code",                 # HA entity boilerplate is intentionally similar
  "global-statement",               # module-level registries (_bosch_audio_registry etc.)
  "import-outside-toplevel",        # circular-import avoidance (see ruff E402 exemptions)
  "not-context-manager",            # HA async protocols lack __enter__/__exit__
  "possibly-used-before-assignment",# HA async branching patterns
  "protected-access",               # coordinator<->entity cross-access is HA pattern
  "redefined-outer-name",           # lazy imports to break cycles (see ruff E402 exemptions)
  "reimported",                     # same symbol imported lazily in multiple scopes
  "too-many-ancestors",             # HA entity hierarchy is 5-6 levels deep
  "try-except-raise",               # `except asyncio.CancelledError: raise` is standard
  "unused-argument",                # HA callback signatures are fixed by the API
  "useless-import-alias",           # `import x as x` is mypy --no-implicit-reexport re-export
  "wrong-import-position",          # late imports for circular-import avoidance
  # project conventions
  "invalid-name",               # HA uses CONFIG_SCHEMA, _WRITE_LOCK_SECS etc.
  "locally-disabled",           # inline disables are deliberate and documented
  "missing-class-docstring",    # typing enforced by mypy --strict; docstrings optional
  "missing-function-docstring", # same
  "too-few-public-methods",     # small dataclass-like helpers are intentional
  "too-many-instance-attributes", # coordinator holds inherently large state
  # complexity metrics — coordinator is inherently large; these fire by design
  "too-many-arguments",
  "too-many-boolean-expressions",
  "too-many-branches",
  "too-many-locals",
  "too-many-nested-blocks",
  "too-many-positional-arguments",
  "too-many-public-methods",
  "too-many-return-statements",
  "too-many-statements",
]
