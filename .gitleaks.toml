# gitleaks config — extends the built-in default ruleset (JWTs, API keys,
# private keys, generic tokens) with narrow allowlists for this repo's known,
# intentionally-present values, so CI secret-scanning stays green while still
# catching real, accidentally-committed credentials.
#
# Domain-specific PII (real camera MACs / LAN IPs / Bosch cloud-IDs) is covered
# by the local pre-push hook (CLAUDE.md SECRETS_SCAN), which holds the exact
# literal patterns; we deliberately do NOT duplicate those values here.

title = "bosch-shc-camera gitleaks config"

[extend]
useDefault = true

# The Bosch Smart Camera app's Firebase API key. It is a PUBLIC client-side app
# identifier shipped in every copy of the APK, restricted by Firebase project
# rules (not by secrecy) and vendor-sanctioned for OSS use — see the docstring
# in custom_components/bosch_shc_camera/fcm.py. gitleaks base64-decodes the
# source literal and flags the decoded `AIza…` key; we allowlist by the *encoded*
# source string (which contains no `AIza…` trigger, so it does not trip the
# local pre-push grep). Scoped to this one value, so any OTHER key still fires.
[[allowlists]]
regexTarget = "line"
regexes = ['''QUl6YVN5Q0toaGZ4ZlRzMUc3V3Z6VERBaU8wQWlzN0VIMjVEYk9z''']

# Generated / local-only artifact directories — never hold committed secrets,
# and most are gitignored anyway. Defensive: keeps a stray local filesystem
# scan quiet without blinding the scanner to tracked source.
[[allowlists]]
paths = [
  '''htmlcov/.*''',
  '''captures/.*''',
  '''credentials/.*''',
  '''snapshots/.*''',
]

# Known-FAKE fixture values used in tests (RFC 5737 TEST-NET, all-ones cloud-ID,
# documented fake MAC). Listed so a future default-rule tightening can't turn
# deliberate test fixtures into red CI. Real values never look like these.
[[allowlists]]
regexes = [
  '''192\.0\.2\.\d{1,3}''',
  '''11111111-1111-1111-1111-111111111111''',
  '''(?:aa:bb:cc:dd:ee:ff)''',
]
