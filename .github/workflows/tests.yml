name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install system dependencies
        run: sudo apt-get install -y libturbojpeg0-dev

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run pytest with coverage
        # -n auto: parallelize across CI runner CPUs (pytest-cov combines
        # per-worker coverage data natively, no COVERAGE_PROCESS_START needed).
        # --dist=loadfile: keep each test file's tests on a single worker in
        # their natural order. Verified locally (2026-07-13): plain `-n auto`
        # (default --dist=load) intermittently reassigns tests across files to
        # different workers between runs, which surfaced a pre-existing
        # cross-file test-isolation gap (~1/3 runs, 2 tests in test_init.py) —
        # not present in serial runs. `--dist=loadfile` eliminated it (3/3
        # identical runs matching the serial baseline) while keeping most of
        # the speedup (~50s vs ~57s vs ~169s serial on a 6-core box).
        run: pytest tests/ --timeout=30 -q -n auto --dist=loadfile --cov custom_components/bosch_shc_camera --cov-report term-missing --cov-fail-under=100
